name: Refresh news every 2 hours

on:
  schedule:
    # Every 2 hours at minute 0, UTC
    - cron: "0 */2 * * *"
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  refresh:
    name: Hit cron endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger /api/cron/refresh
        run: |
          STATUS=$(curl -fsSL -o /tmp/response.json -w "%{http_code}" \
            -X POST "${{ secrets.REFRESH_URL }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 90)

          echo "HTTP status: $STATUS"
          echo "Response:"
          cat /tmp/response.json

          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "::error::Cron endpoint returned $STATUS"
            exit 1
          fi
